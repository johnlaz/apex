<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">APEX: a number, and the receipts.</title>
  <desc id="d">Banner for APEX, an AI vehicle analyzer. A receipt-style card shows a live-sourced valuation.</desc>
  <rect width="1200" height="300" rx="16" fill="#0a0a0a"/>
  <rect x="1" y="1" width="1198" height="298" rx="15" fill="none" stroke="#2a2a2a" stroke-width="2"/>
  <g fill="none" stroke="#e8231a" stroke-opacity=".08" stroke-width="1"><path d="M0 100H1200M0 200H1200M300 0V300M600 0V300M900 0V300"/></g>
  <text x="70" y="96" font-family="Impact,'Arial Narrow Bold',sans-serif" font-size="30" letter-spacing="10" fill="#ff4338">APEX</text>
  <text x="70" y="178" font-family="Impact,'Arial Narrow Bold',sans-serif" font-size="82" fill="#f2f2f5">A number,</text>
  <text x="70" y="256" font-family="Impact,'Arial Narrow Bold',sans-serif" font-size="82" fill="#f2f2f5">and the <tspan fill="#ff4338">receipts.</tspan></text>
  <g transform="translate(790 34) rotate(2 180 110)">
    <rect width="340" height="232" rx="4" fill="#f3efe6"/>
    <rect x="16" y="16" width="308" height="28" fill="#e1f2e5" stroke="#9bd2aa"/>
    <text x="28" y="35" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" letter-spacing="1.5" fill="#17602f">LIVE-SOURCED · AS OF TODAY</text>
    <text x="16" y="82" font-family="Impact,'Arial Narrow Bold',sans-serif" font-size="26" fill="#17150f">2021 Toyota Camry XSE</text>
    <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#17150f">
      <line x1="16" x2="324" y1="102" y2="102" stroke="#b9b3a0" stroke-dasharray="4 3"/>
      <text x="16" y="124">Dealer retail</text><text x="324" y="124" text-anchor="end" font-size="18" font-weight="700">$27,500</text>
      <line x1="16" x2="324" y1="138" y2="138" stroke="#b9b3a0" stroke-dasharray="4 3"/>
      <text x="16" y="160">Comp · 41,000 mi</text><text x="324" y="160" text-anchor="end">$26,995</text>
      <text x="16" y="178" fill="#0d5fb0" text-decoration="underline">cars.com/…/vehicledetail</text>
      <line x1="16" x2="324" y1="190" y2="190" stroke="#b9b3a0" stroke-dasharray="4 3"/>
      <text x="16" y="212" fill="#6d685a" font-size="11">Sample · illustrative numbers</text>
    </g>
  </g>
</svg>
